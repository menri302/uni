<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" width="760" height="450" font-family="Helvetica, Arial, sans-serif">
<style>.ax{stroke:#333;stroke-width:1.2} .l{font-size:13px;fill:#333} .b{font-size:14px;font-weight:bold;fill:#222} .h{stroke:#999;stroke-width:0.8;stroke-dasharray:3 3}</style>
<rect width="760" height="450" fill="#ffffff"/>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#333"/></marker></defs>
<line x1="70" y1="330" x2="640" y2="330" class="ax" marker-end="url(#ar)"/>
<line x1="70" y1="330" x2="70" y2="40" class="ax" marker-end="url(#ar)"/>
<text x="600" y="352" class="b">x (Stück)</text><text x="78" y="45" class="b">K</text>
<!-- Hilfslinien -->
<line x1="70" y1="137" x2="571" y2="137" class="h"/><line x1="571" y1="137" x2="571" y2="330" class="h"/>
<text x="62" y="141" class="b" text-anchor="end">K(x)</text><text x="571" y="350" class="b" text-anchor="middle">x</text>
<!-- Fahrstrahl (DK) -->
<line x1="70" y1="330" x2="640" y2="110" stroke="#2a5bd7" stroke-width="2"/>
<!-- Tangente (GK) -->
<line x1="490" y1="237" x2="630" y2="64" stroke="#d93025" stroke-width="2" stroke-dasharray="7 4"/>
<!-- Gesamtkosten -->
<path d="M70 270 C330 250 430 240 500 200 C560 165 590 110 620 70" fill="none" stroke="#111" stroke-width="2.4"/>
<circle cx="571" cy="137" r="5.5" fill="#111"/>
<circle cx="70" cy="330" r="4" fill="#2a5bd7"/>
<!-- Beschriftung wie auf der Folie -->
<text x="455" y="58" class="b" style="fill:#d93025">Steigung: Grenzkosten</text>
<text x="455" y="76" class="l" style="fill:#d93025">GK(x) = K′(x)</text>
<text x="600" y="160" class="b" style="fill:#2a5bd7">Steigung:</text>
<text x="600" y="177" class="b" style="fill:#2a5bd7">Durchschnittskosten</text>
<text x="600" y="194" class="l" style="fill:#2a5bd7">DK(x) = K(x)/x</text>
<!-- Legende -->
<line x1="70" y1="378" x2="100" y2="378" stroke="#111" stroke-width="2.4"/><text x="110" y="382" class="l">K(x): Gesamtkosten</text>
<line x1="70" y1="402" x2="100" y2="402" stroke="#2a5bd7" stroke-width="2"/><text x="110" y="406" class="l">Fahrstrahl vom Ursprung zu (x | K(x)) → Steigung K(x)/x = Durchschnittskosten</text>
<line x1="70" y1="426" x2="100" y2="426" stroke="#d93025" stroke-width="2" stroke-dasharray="7 4"/><text x="110" y="430" class="l">Tangente in x → Steigung K′(x) = Grenzkosten</text>
</svg>
