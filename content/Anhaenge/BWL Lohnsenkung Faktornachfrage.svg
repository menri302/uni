<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="640" height="520" font-family="Helvetica, Arial, sans-serif">
<style>.ax{stroke:#333;stroke-width:1.2} .l{font-size:13px;fill:#333} .b{font-size:14px;font-weight:bold;fill:#222}</style>
<rect width="640" height="520" fill="#ffffff"/>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#333"/></marker></defs>
<line x1="60" y1="330" x2="575" y2="330" class="ax" marker-end="url(#ar)"/>
<line x1="60" y1="330" x2="60" y2="30" class="ax" marker-end="url(#ar)"/>
<text x="555" y="352" class="b">r₁</text><text x="36" y="40" class="b">r₂</text>
<!-- alte Isoquante x0 -->
<polyline points="91,69 94,92 97,111 100,128 103,142 106,154 109,165 112,174 115,183 118,190 121,197 124,203 127,209 130,214 133,219 136,223 139,227 142,231 152,242 162,251 172,258 182,264 192,269 202,273 212,277 222,280 232,283 242,285 252,288 262,290 272,292 282,294 292,295 302,297 312,298 322,299 332,300 342,301 352,302 362,303 372,304 382,305" fill="none" stroke="#111" stroke-width="2"/>
<text x="390" y="309" class="b">x₀</text>
<!-- Kostengeraden -->
<line x1="60" y1="60" x2="180" y2="330" stroke="#3a96c8" stroke-width="1.8" stroke-dasharray="2 3"/>
<line x1="60" y1="191" x2="292" y2="330" stroke="#1e9e6e" stroke-width="2.2" stroke-dasharray="9 5"/>
<line x1="60" y1="60" x2="510" y2="330" stroke="#d93025" stroke-width="2.2"/>
<!-- mögliche höhere Isoquanten -->
<path d="M80 42 Q90 78 110 90 Q130 102 155 108" fill="none" stroke="#c77700" stroke-width="2" stroke-dasharray="5 3"/>
<path d="M330 177 Q350 234 380 252 Q410 270 460 288" fill="none" stroke="#c77700" stroke-width="2" stroke-dasharray="5 3"/>
<!-- Punkte -->
<circle cx="60" cy="60" r="4.5" fill="#222"/>
<circle cx="120" cy="195" r="5.5" fill="#3a96c8"/><text x="129" y="190" class="b">A</text>
<circle cx="176" cy="260" r="5.5" fill="#1e9e6e"/><text x="166" y="284" class="b" text-anchor="end">B</text>
<circle cx="110" cy="90" r="4.5" fill="#c77700"/><text x="166" y="82" class="b">Fall 1</text>
<circle cx="380" cy="252" r="4.5" fill="#c77700"/><text x="392" y="198" class="b">Fall 2</text>
<!-- Legende -->
<line x1="40" y1="372" x2="70" y2="372" stroke="#111" stroke-width="2"/><text x="80" y="376" class="l">x₀: alte Isoquante (bisherige Produktionsmenge)</text>
<line x1="40" y1="396" x2="70" y2="396" stroke="#3a96c8" stroke-width="1.8" stroke-dasharray="2 3"/><text x="80" y="400" class="l">vorher: alte Kostengerade (steil) → MKK A</text>
<line x1="40" y1="420" x2="70" y2="420" stroke="#1e9e6e" stroke-width="2.2" stroke-dasharray="9 5"/><text x="80" y="424" class="l">gleicher Output: neue Preise, berührt x₀ in B → mehr Arbeit (eindeutig)</text>
<line x1="40" y1="444" x2="70" y2="444" stroke="#d93025" stroke-width="2.2"/><text x="80" y="448" class="l">gleiche Gesamtkosten: um r₂-Achsenpunkt gedreht → liegt über x₀ (mehr Output)</text>
<line x1="40" y1="468" x2="70" y2="468" stroke="#c77700" stroke-width="2" stroke-dasharray="5 3"/><text x="80" y="472" class="l">höhere Isoquante (Ausschnitt) zweier möglicher Techniken → Fall 1 oder Fall 2</text>
<text x="80" y="492" class="l">Fall 1: weniger Arbeit, mehr Energie · Fall 2: mehr Arbeit → Gesamtwirkung unklar</text>
<circle cx="55" cy="510" r="4.5" fill="#222"/><text x="80" y="514" class="l">Drehpunkt: nur Energie kaufen kostet gleich viel wie vorher</text>
</svg>
