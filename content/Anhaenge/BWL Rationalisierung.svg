<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" width="600" height="470" font-family="Helvetica, Arial, sans-serif">
<style>.ax{stroke:#333;stroke-width:1.2} .l{font-size:13px;fill:#333} .b{font-size:14px;font-weight:bold;fill:#222} .h{stroke:#999;stroke-width:0.8;stroke-dasharray:3 3}</style>
<rect width="600" height="470" fill="#ffffff"/>
<defs>
<marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#333"/></marker>
</defs>
<line x1="60" y1="330" x2="560" y2="330" class="ax" marker-end="url(#ar)"/>
<line x1="60" y1="330" x2="60" y2="30" class="ax" marker-end="url(#ar)"/>
<text x="520" y="352" class="b">r₁ Arbeit</text><text x="68" y="38" class="b">r₂ Kapital</text>
<!-- Isoquante x0 -->
<polyline points="91,69 94,92 97,111 100,128 103,142 106,154 109,165 112,174 115,183 118,190 121,197 124,203 127,209 130,214 133,219 136,223 139,227 142,231 152,242 162,251 172,258 182,264 192,269 202,273 212,277 222,280 232,283 242,285 252,288 262,290 272,292 282,294 292,295 302,297 312,298 322,299 332,300 342,301 352,302 362,303 372,304 382,305" fill="none" stroke="#111" stroke-width="2"/>
<text x="390" y="309" class="b">x₀</text>
<!-- Kostengeraden -->
<line x1="60" y1="191" x2="292" y2="330" stroke="#3a96c8" stroke-width="2.2" stroke-dasharray="8 4"/>
<line x1="60" y1="60" x2="180" y2="330" stroke="#d93025" stroke-width="2.2"/>
<!-- Hilfslinien -->
<line x1="176" y1="260" x2="176" y2="330" class="h"/><line x1="120" y1="195" x2="120" y2="330" class="h"/>
<line x1="60" y1="260" x2="176" y2="260" class="h"/><line x1="60" y1="195" x2="120" y2="195" class="h"/>
<path d="M168 246 Q150 222 132 206" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#ar)"/>
<circle cx="176" cy="260" r="5.5" fill="#3a96c8"/><text x="186" y="256" class="b">A</text>
<circle cx="120" cy="195" r="5.5" fill="#d93025"/><text x="130" y="190" class="b">B</text>
<text x="176" y="348" class="l" text-anchor="middle">r₁ alt</text><text x="120" y="348" class="l" text-anchor="middle">r₁ neu</text>
<!-- Legende -->
<line x1="60" y1="380" x2="90" y2="380" stroke="#111" stroke-width="2"/><text x="100" y="384" class="l">Isoquante x₀: gleicher Output vorher und nachher</text>
<line x1="60" y1="404" x2="90" y2="404" stroke="#3a96c8" stroke-width="2.2" stroke-dasharray="8 4"/><text x="100" y="408" class="l">vorher: Arbeit günstig → flache Kostengerade → MKK A</text>
<line x1="60" y1="428" x2="90" y2="428" stroke="#d93025" stroke-width="2.2"/><text x="100" y="432" class="l">Lohn q₁ ↑ (z.B. Mindestlohn) → steilere Kostengerade → MKK B</text>
<text x="100" y="456" class="l">A → B: weniger Arbeit, mehr Kapital = Rationalisierungsinvestition</text>
</svg>
