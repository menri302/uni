<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Helvetica, Arial, sans-serif">
<style>.ax{stroke:#333;stroke-width:1.2} .d{stroke:#c0392b;stroke-width:1;stroke-dasharray:4 4} .l{font-size:14px;fill:#333} .b{font-size:15px;font-weight:bold;fill:#222} .h{font-size:17px;font-weight:bold;fill:#222}</style>
<rect width="760" height="470" fill="#ffffff"/>
<text x="380" y="28" class="h" text-anchor="middle">Marktnachfrage (horizontale Aggregation)</text>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#333"/></marker></defs>
<!-- Achsen -->
<line x1="80" y1="400" x2="80" y2="50" class="ax" marker-end="url(#ar)"/>
<line x1="80" y1="400" x2="700" y2="400" class="ax" marker-end="url(#ar)"/>
<text x="62" y="60" class="b">P</text>
<text x="700" y="425" class="b">Q</text>
<!-- Kurven -->
<line x1="80" y1="120" x2="272.5" y2="400" stroke="#1f4e9c" stroke-width="2"/>
<line x1="80" y1="120" x2="465" y2="400" stroke="#8e8de0" stroke-width="2"/>
<line x1="80" y1="120" x2="657.5" y2="400" stroke="#c0392b" stroke-width="2.5"/>
<text x="282" y="388" class="l" fill="#1f4e9c">N₁: P = 7 − Q/50</text>
<text x="474" y="388" class="l" fill="#6c6bd0">N₂: P = 7 − Q/100</text>
<text x="500" y="250" class="l" fill="#c0392b" font-weight="bold">Marktnachfrage: P = 7 − Q/150</text>
<!-- P = 7 -->
<circle cx="80" cy="120" r="5" fill="#c0392b"/>
<text x="58" y="125" class="l">7</text>
<!-- P = 5 -->
<line x1="80" y1="200" x2="245" y2="200" class="d"/>
<text x="38" y="205" class="l" fill="#c0392b">P = 5</text>
<line x1="135" y1="200" x2="135" y2="400" class="d"/>
<line x1="190" y1="200" x2="190" y2="400" class="d"/>
<line x1="245" y1="200" x2="245" y2="400" class="d"/>
<circle cx="135" cy="200" r="4" fill="#1f4e9c"/>
<circle cx="190" cy="200" r="4" fill="#6c6bd0"/>
<circle cx="245" cy="200" r="5" fill="#c0392b"/>
<text x="135" y="420" class="l" text-anchor="middle" fill="#c0392b">100</text>
<text x="190" y="420" class="l" text-anchor="middle" fill="#c0392b">200</text>
<text x="245" y="420" class="l" text-anchor="middle" fill="#c0392b">300</text>
<!-- Erklärung -->
<text x="80" y="447" class="l">Bei P = 5: Käufer 1 fragt 100 nach, Käufer 2 fragt 200 nach → Markt: 100 + 200 = 300</text>
<text x="80" y="465" class="l">Mengen bei gleichem Preis addieren: Q = 50·(7 − P) + 100·(7 − P) = 150·(7 − P)</text>
</svg>
